openapi: 3.0.0
info:
  title: otchetik
  version: 1.0.0
# Один адрес для веб-версии и сервера команды (спека 26.09 §2): страница из бакета,
# /api/* и /photos пересылаются на http-сервер команды. CORS не нужен: тот же origin.
paths:
  /obyektiv:
    get:
      x-yc-apigateway-integration:
        type: object_storage
        bucket: obyektiv-web
        object: index.html
        service_account_id: ajefqllmgqu6fb864a3j
  /obyektiv/:
    get:
      x-yc-apigateway-integration:
        type: object_storage
        bucket: obyektiv-web
        object: index.html
        service_account_id: ajefqllmgqu6fb864a3j
  /obyektiv/{file+}:
    get:
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: object_storage
        bucket: obyektiv-web
        object: '{file}'
        # SPA-фолбэк: перезагрузка глубокой ссылки (например, /obyektiv/rating) просит
        # объект, которого нет в бакете (там только index.html и ассеты) — отдаём index.html.
        error_object: index.html
        service_account_id: ajefqllmgqu6fb864a3j
  /api/{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: http
        url: 'http://217.18.63.89:8000/api/{path}'
        timeouts:
          connect: 10
          read: 120
        # Без этого query и Content-Type multipart (boundary) не доходят до сервера.
        headers:
          '*': '*'
        query:
          '*': '*'
  /photos:
    get:
      x-yc-apigateway-integration:
        type: http
        url: 'http://217.18.63.89:8000/photos'
        timeouts:
          connect: 10
          read: 120
        # Без этого query-параметры limit и offset не доходят до сервера.
        headers:
          '*': '*'
        query:
          '*': '*'
